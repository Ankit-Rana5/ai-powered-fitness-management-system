spring:
  application:
    name: USER-SERVICE
  datasource:
      url: jdbc:postgresql://localhost:5432/fitness-micro-user
      username: postgres
      password: microservice@111

  jpa:
    hibernate:
      ddl-auto: update
      database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true